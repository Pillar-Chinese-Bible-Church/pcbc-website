# Introduction and church vision: PCBC 核心價值 v3, supplied by Pastor Bill Yang.
# Traditional Chinese preserves the source wording; English is translated for review.
# Pastor biography supplied by the church on 2026-11-22; English is translated from that text.
title:
  zh: 关于我们
  hant: 關於我們
  en: About Us
intro:
  zh: 柱石华人圣经教会（Pillar Chinese Bible Church，简称PCBC）是一间位于硅谷、以耶稣基督为中心、以圣经为信仰与生活最高权威的福音派教会。我们相信，教会属于基督，必须按照神在圣经中的教导来建立，而不是随从人的传统、喜好或时代的潮流。
  hant: 柱石華人聖經教會（Pillar Chinese Bible Church，簡稱PCBC）是一間位於硅谷、以耶穌基督為中心、以聖經為信仰與生活最高權威的福音派教會。我們相信，教會屬於基督，必須按照神在聖經中的教導來建立，而不是隨從人的傳統、喜好或時代的潮流。
  en: Pillar Chinese Bible Church (PCBC) is an evangelical church in Silicon Valley, centered on Jesus Christ, with the Bible as the highest authority for faith and life. We believe that the church belongs to Christ and must be built according to God’s teaching in Scripture, rather than following human traditions, preferences, or the trends of the times.
mission:
  heading:
    zh: 我们所追求的教会
    hant: 我們所追求的教會
    en: The Church We Seek to Build
  text:
    zh: 我们深知世上没有一间完美的教会，但我们渴望靠着神的恩典，建立一间忠于圣经、持守福音、彼此相爱、积极宣教的健康教会。我们重视忠心的释经讲道-按着正意分解真理的道、合乎圣经的敬拜、有意义的教会成员关系，以及彼此委身的门徒生活，使每一位信徒在圣经的真理和爱中一同成长，越来越像基督。
    hant: 我們深知世上沒有一間完美的教會，但我們渴望靠著神的恩典，建立一間忠於聖經、持守福音、彼此相愛、積極宣教的健康教會。我們重視忠心的釋經講道-按著正意分解真理的道、合乎聖經的敬拜、有意義的教會成員關係，以及彼此委身的門徒生活，使每一位信徒在聖經的真理和愛中一同成長，越來越像基督。
    en: We know that no church in this world is perfect, but by God’s grace we long to build a healthy church that is faithful to Scripture, holds fast to the gospel, loves one another, and actively engages in missions. We value faithful expository preaching that rightly handles the word of truth, biblical worship, meaningful church membership, and a life of discipleship marked by commitment to one another, so that every believer grows together in biblical truth and love, becoming more like Christ.
  welcome:
    zh: 无论你正在探索信仰，或是希望在圣经真理中扎根成长，我们都诚挚欢迎你与我们一同认识基督、经历福音，并在祂的教会中彼此扶持、共同成长。
    hant: 無論你正在探索信仰，或是希望在聖經真理中紮根成長，我們都誠摯歡迎你與我們一同認識基督、經歷福音，並在祂的教會中彼此扶持、共同成長。
    en: Whether you are exploring the faith or seeking to become rooted and grow in biblical truth, we warmly welcome you to know Christ and experience the gospel with us, supporting one another and growing together in His church.
pastor:
  heading: { zh: 牧者介绍, hant: 牧者介紹, en: Our Pastor }
  name: { zh: 杨东牧师, hant: 楊東牧師, en: Pastor Bill Yang }
  role: { zh: 柱石华人圣经教会 牧师, hant: 柱石華人聖經教會 牧師, en: "Pastor, Pillar Chinese Bible Church" }
  bio:
    zh: |-
      杨东牧师出生于北京，大学期间主修芯片设计专业，毕业后在中科院软件所工作，后于1996年到美国的一家网络公司任职。

      来美后开始接触基督教信仰，但从小接受无神论的思想教育，只相信自己，认为人定胜天。虽然一直心里刚硬并经过多年的慕道，但因着神的恩典，于2008年决志信主，2009年受洗归入主的名下。

      2017年与妻子一同蒙召全职事奉，2018年开始在山景城中国基督教会实习，2021年获得道学硕士学位并于2022年按立为教会牧师。2026年与一批有同样异象的弟兄姐妹创立了柱石华人圣经教会。
    hant: |-
      楊東牧師出生於北京，大學期間主修芯片設計專業，畢業後在中科院軟件所工作，後於1996年到美國的一家網絡公司任職。

      來美後開始接觸基督教信仰，但從小接受無神論的思想教育，只相信自己，認為人定勝天。雖然一直心裡剛硬並經過多年的慕道，但因著神的恩典，於2008年決志信主，2009年受洗歸入主的名下。

      2017年與妻子一同蒙召全職事奉，2018年開始在山景城中國基督教會實習，2021年獲得道學碩士學位並於2022年按立為教會牧師。2026年與一批有同樣異象的弟兄姐妹創立了柱石華人聖經教會。
    en: |-
      Pastor Bill Yang was born in Beijing and majored in chip design in college. After graduating, he worked at the Institute of Software of the Chinese Academy of Sciences. In 1996, he moved to the United States to work for a networking company.

      After coming to the United States, he began exploring the Christian faith. Having grown up with an atheistic education, however, he trusted only in himself and believed that human determination could overcome anything. His heart remained hardened through many years of seeking, but by God’s grace, he committed his life to Christ in 2008 and was baptized in 2009.

      In 2017, he and his wife were called together to full-time ministry. He began an internship at Mountain View Chinese Christian Church in 2018, earned a Master of Divinity degree in 2021, and was ordained as a pastor in 2022. In 2026, he and a group of brothers and sisters who shared the same vision founded Pillar Chinese Bible Church.
  email: bill.yang@pillarcbc.org
  email_label: { zh: 联系牧师, hant: 聯絡牧師, en: Email Pastor Bill }

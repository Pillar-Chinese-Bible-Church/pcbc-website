title: { zh: 关于我们, hant: 關於我們, en: About Us }
intro:
  zh: 柱石华人圣经教会以圣经为根基，陪伴华人家庭在信仰、生活与彼此相爱中一同成长。
  hant: 柱石華人聖經教會以聖經為根基，陪伴華人家庭在信仰、生活與彼此相愛中一同成長。
  en: Pillar Chinese Bible Church is rooted in the Bible, walking alongside Chinese families as we grow together in faith, in daily life, and in love for one another.
mission:
  heading: { zh: 使命宣言, hant: 使命宣言, en: Our Mission }
  text:
    zh: 以神的话语为根基，在敬拜中彼此合一，我们存在是为了荣耀神：在硅谷建立一个跨世代、双语的信仰群体，借着基督的爱使生命得着改变。
    hant: 以神的話語為根基，在敬拜中彼此合一，我們存在是為了榮耀神：在矽谷建立一個跨世代、雙語的信仰群體，藉著基督的愛使生命得著改變。
    en: Rooted in God’s Word and united in worship, we exist to glorify God by cultivating a multi-generational, bilingual community in Silicon Valley that transforms lives through the love of Christ.

week:
  heading:
    zh: 每周聚会
    en: During the Week
  intro:
    zh: 我们所有的聚会都以耶稣为中心。不管是祷告、查经还是团契，都是为了让我们更爱祂，也更明白祂的真理。
    en: Everything we do during the week points back to Jesus. Whether we’re praying, studying the Bible or just talking, we want to love Him more and understand His truth better.
  gatherings:
    - name:
        zh: 祷告会
        en: Prayer Meeting

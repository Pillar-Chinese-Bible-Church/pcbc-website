# Content adapted from the church's giving pages on 2026-11-16:
# https://pillarcbc.org/奉献/ and https://pillarcbc.org/en/giving/
# Keep the recipient and original QR code in sync when editing giving instructions.
title: { zh: 奉献, hant: 奉獻, en: Giving }
intro:
  zh: 柱石华人圣经教会是 501(c)(3) 非营利教会组织。衷心感谢您对教会慷慨的支持与奉献！
  hant: 柱石華人聖經教會是 501(c)(3) 非營利教會組織。衷心感謝您對教會慷慨的支持與奉獻！
  en: Pillar Chinese Bible Church is a 501(c)(3) nonprofit church organization. Thank you for your generous support!
thanks:
  zh: 您渴望看见教会事工成长、神的国度扩展的心，使我们大受鼓舞。我们很喜乐能与您同工，一同参与神在这里所成就的一切。
  hant: 您渴望看見教會事工成長、神的國度擴展的心，使我們大受鼓舞。我們很喜樂能與您同工，一同參與神在這裡所成就的一切。
  en: We are encouraged by your desire to see our ministry grow and God’s Kingdom expand. It is our joy to partner with you in all that God is doing here.
methods_heading: { zh: 奉献方式, hant: 奉獻方式, en: Ways to give }

# Source: PCBC 核心價值 v3, supplied by Pastor Bill Yang.
# Shared official titles/full text/references for About Us, with homepage summaries.
# Traditional Chinese retains the source wording (PDF line breaks and spacing normalized).
# English titles are from the source; English body text is translated for review.
items:
  - title:
      zh: 扎根基督真道
      hant: 紮根基督真道
      en: Rooted in Christ's Word
    summary:
      zh: 以释经讲道为核心，忠心传讲、认真学习并顺服神的话，让福音和圣经真理塑造我们的生命与事奉。
      hant: 以釋經講道為核心，忠心傳講、認真學習並順服神的話，讓福音和聖經真理塑造我們的生命與事奉。
      en: With expository preaching at the center, we proclaim, study, and obey God’s Word, allowing the gospel and biblical truth to shape our lives and service.
    text:
      zh: 我们相信全本圣经是神所默示、全然可信、具有最高权威的话语。我们致力于以释经讲道为核心，忠心传讲、认真学习并顺服神的话，让福音和圣经真理塑造教会的信仰、信徒的生命与事奉。
      hant: 我們相信全本聖經是神所默示、全然可信、具有最高權威的話語。我們致力於以釋經講道為核心，忠心傳講、認真學習並順服神的話，讓福音和聖經真理塑造教會的信仰、信徒的生命與事奉。
      en: We believe that the whole Bible is God’s inspired, completely trustworthy Word and has the highest authority. With expository preaching at the center, we are committed to faithfully proclaiming, diligently studying, and obeying God’s Word, so that the gospel and biblical truth shape the church’s beliefs and the lives and service of believers.
    refs:
      zh: 尼希米记 8:8；约翰福音 17:17；歌罗西书 3:16-17；提摩太后书 3:16-17；4:2
      hant: 尼希米記 8:8；約翰福音 17:17；歌羅西書 3:16-17；提摩太後書 3:16-17；4:2
      en: Nehemiah 8:8; John 17:17; Colossians 3:16-17; 2 Timothy 3:16-17; 4:2
  - title:
      zh: 全人敬拜基督
      hant: 全人敬拜基督
      en: Worshiping Christ with Our Whole Lives
    summary:
      zh: 以基督为中心，借着合乎圣经的敬拜、祷告与日常生活中的顺服和忠心事奉，以全人的生命荣耀神。
      hant: 以基督為中心，藉著合乎聖經的敬拜、禱告與日常生活中的順服和忠心事奉，以全人的生命榮耀神。
      en: With Christ at the center, we glorify God with our whole lives through biblical worship, prayer, obedience, and faithful service in everyday life.
    text:
      zh: 我们相信基督是教会的元首，也是我们敬拜与生活的中心。我们以福音为根基，借着合乎圣经的集体敬拜、祷告、洗礼与主餐，以及日常生活中的顺服与忠心事奉，以全人的生命尊崇基督、荣耀神。
      hant: 我們相信基督是教會的元首，也是我們敬拜與生活的中心。我們以福音為根基，藉著合乎聖經的集體敬拜、禱告、洗禮與主餐，以及日常生活中的順服與忠心事奉，以全人的生命尊崇基督、榮耀神。
      en: We believe that Christ is the head of the church and the center of our worship and life. Grounded in the gospel, we honor Christ and glorify God with our whole lives through biblical corporate worship, prayer, baptism, and the Lord’s Supper, as well as obedience and faithful service in daily life.
    refs:
      zh: 罗马书 12:1-2；哥林多前书 11:23-26；歌罗西书 1:18；提摩太前书 2:1-7；彼得前书 4:10-11
      hant: 羅馬書 12:1-2；哥林多前書 11:23-26；歌羅西書 1:18；提摩太前書 2:1-7；彼得前書 4:10-11
      en: Romans 12:1-2; 1 Corinthians 11:23-26; Colossians 1:18; 1 Timothy 2:1-7; 1 Peter 4:10-11
  - title:
      zh: 活出基督真爱
      hant: 活出基督真愛
      en: Living Out Christ's Love
    summary:
      zh: 作为彼此委身的属灵家庭，在真理与恩典中彼此相爱、关怀、劝勉和守望，一同成长。
      hant: 作為彼此委身的屬靈家庭，在真理與恩典中彼此相愛、關懷、勸勉和守望，一同成長。
      en: As a spiritual family committed to one another, we love, care for, encourage, and watch over one another, growing together in truth and grace.
    text:
      zh: 我们相信教会是基督的身体，是信徒彼此委身的属灵家庭。我们致力于建立有意义的教会成员制度，彼此相爱、关怀、劝勉、守望，在真理与恩典中彼此造就、一同成长，活出福音所带来更新的生命。
      hant: 我們相信教會是基督的身體，是信徒彼此委身的屬靈家庭。我們致力於建立有意義的教會成員制度，彼此相愛、關懷、勸勉、守望，在真理與恩典中彼此造就、一同成長，活出福音所帶來更新的生命。
      en: We believe that the church is the body of Christ, a spiritual family in which believers are committed to one another. We are committed to establishing meaningful church membership, loving, caring for, encouraging, and watching over one another. In truth and grace, we build one another up, grow together, and live out the new life brought by the gospel.
    refs:
      zh: 马太福音 18:15-20；约翰福音 13:34-35；哥林多前书 12:12-27；以弗所书 2:19-22；以弗所书 4:15-16；希伯来书 10:24-25
      hant: 馬太福音 18:15-20；約翰福音 13:34-35；哥林多前書 12:12-27；以弗所書 2:19-22；以弗所書 4:15-16；希伯來書 10:24-25
      en: Matthew 18:15-20; John 13:34-35; 1 Corinthians 12:12-27; Ephesians 2:19-22; Ephesians 4:15-16; Hebrews 10:24-25
  - title:
      zh: 承担基督使命
      hant: 承擔基督使命
      en: Embracing Christ's Great Commission
    summary:
      zh: 在家庭、社区、职场及世界各地传扬全备的福音，带领人跟随基督、培育门徒，积极参与本地及普世宣教。
      hant: 在家庭、社區、職場及世界各地傳揚全備的福音，帶領人跟隨基督、培育門徒，積極參與本地及普世宣教。
      en: We proclaim the whole gospel in our homes, communities, workplaces, and around the world, leading people to follow Christ, making disciples, and taking part in local and global missions.
    text:
      zh: 我们相信教会蒙召向万民传扬耶稣基督的福音。我们致力于在家庭、社区、职场及世界各地忠心传扬全备的福音，带领人认识并跟随耶稣基督，为信主的人施洗，使他们归入地方教会，教导他们遵守主的一切命令，培育门徒，并积极参与本地及普世宣教。
      hant: 我們相信教會蒙召向萬民傳揚耶穌基督的福音。我們致力於在家庭、社區、職場及世界各地忠心傳揚全備的福音，帶領人認識並跟隨耶穌基督，為信主的人施洗，使他們歸入地方教會，教導他們遵守主的一切命令，培育門徒，並積極參與本地及普世宣教。
      en: We believe that the church is called to proclaim the gospel of Jesus Christ to all peoples. We are committed to faithfully proclaiming the whole gospel in our homes, communities, workplaces, and around the world; leading people to know and follow Jesus Christ; baptizing those who believe and bringing them into local churches; teaching them to obey all the Lord’s commands; making disciples; and actively participating in local and global missions.
    refs:
      zh: 马太福音 28:18-20；使徒行传 1:8，2:41-42；歌罗西书 1:28-29；提摩太后书 2:2
      hant: 馬太福音 28:18-20；使徒行傳 1:8，2:41-42；歌羅西書 1:28-29；提摩太後書 2:2
      en: Matthew 28:18-20; Acts 1:8, 2:41-42; Colossians 1:28-29; 2 Timothy 2:2

# 信仰告白（请牧者审阅后再修改）
# 每段文字有三个格子：zh = 简体，en = English，hant = 繁體（可以不填，网站会自动从简体转换）。

title:
  zh: 信仰告白
  en: What We Teach
subtitle:
  zh: 我们所信、所教导的
  en: Statement of Faith · 信仰告白
intro:
  zh: 以下是我们教会所相信、所教导的要点。每一条都附上相关经文，欢迎你自己翻开圣经查考。
  en: These are the main things our church believes and teaches. Each point lists Bible passages, so you can read them for yourself.
items:
  - title:
      zh: 圣经
      en: The Bible
    text:
      zh: 我们相信圣经是神写给人的话。新旧约六十六卷书都是圣灵借着人写成的，完全无误，是我们信仰和生活的最高权威。圣经从不过时，在日常生活中给我们教导、安慰、鼓励和命令。
      en: We believe the Bible is God’s Word to us. The Holy Spirit moved human authors to write all 66 books of the Old and New Testaments. It is without error and is the final authority for what we believe and how we live. It never goes out of date, and it teaches, comforts, encourages and directs us in everyday life.
    refs:
      zh: 诗19:7–11；诗119:160；林前2:7–13；提后3:16；彼后1:20–21
      en: Ps 19:7–11; Ps 119:160; 1 Cor 2:7–13; 2 Tim 3:16; 2 Pet 1:20–21
  - title:
      zh: 独一的神
      en: One God
    text:
      zh: 我们相信只有一位真神，永远存在于圣父、圣子、圣灵三个位格之中。
      en: "We believe there is one true God, who exists eternally as three Persons: the Father, the Son and the Holy Spirit."
    refs:
      zh: 申6:4；赛45:5–7；太28:19；林后13:14
      en: Deut 6:4; Isa 45:5–7; Matt 28:19; 2 Cor 13:14
  - title:
      zh: 父神
      en: God the Father
    text:
      zh: 我们相信父神掌管整个宇宙。祂创造万有、托住万有，也治理万有。
      en: We believe God the Father rules over the whole universe. He made all things, holds all things together and governs all things.
    refs:
      zh: 创1:1–31；诗103:19；罗11:36；林前8:6
      en: Gen 1:1–31; Ps 103:19; Rom 11:36; 1 Cor 8:6
  - title:
      zh: 耶稣基督
      en: Jesus Christ
    text:
      zh: 我们相信耶稣基督是完全的神，也是完全的人。祂由圣灵感孕、童贞女马利亚所生，神性和人性联合在一个位格里。祂在十字架上舍命，成就了我们的救赎；第三天从死里复活，胜过了死亡。
      en: We believe Jesus Christ is fully God and fully man. He was conceived by the Holy Spirit and born of the virgin Mary, uniting a divine and a human nature in one person. By dying on the cross He accomplished our redemption, and on the third day He rose from the dead, defeating death.
    refs:
      zh: 路1:35；约1:14；徒2:30–33；罗3:24–25；彼前2:24
      en: Luke 1:35; John 1:14; Acts 2:30–33; Rom 3:24–25; 1 Pet 2:24
  - title:
      zh: 圣灵
      en: The Holy Spirit
    text:
      zh: 我们相信圣灵在世上成就神的旨意。祂叫世人为罪自责，荣耀主耶稣，使人重生、能够相信耶稣得救，也在信徒生命中工作，使我们越来越像基督。
      en: We believe the Holy Spirit carries out God’s will in the world. He convicts people of sin and glorifies Jesus. He gives new birth so that people can believe and be saved, and He keeps working in believers to make them more like Christ.
    refs:
      zh: 约3:5–7；约16:7–9；罗8:9；林后3:18；弗2:22
      en: John 3:5–7; John 16:7–9; Rom 8:9; 2 Cor 3:18; Eph 2:22
  - title:
      zh: 人
      en: Humanity
    text:
      zh: 我们相信神照着自己的形像造人，为要人敬拜祂。因亚当的悖逆，罪进入世界，人人都在思想、言语和行为上得罪了神，落在属灵和肉身的死亡之下，靠自己无法回转归向神。我们唯一的盼望是神借着耶稣基督所赐的恩典。在基督里蒙拯救的人，得以重新活出敬拜神的人生。
      en: We believe God made every person in His image, to worship Him. Through Adam’s disobedience sin entered the world. Everyone has sinned against God in thought, word and deed, lives under spiritual and physical death, and cannot turn back to God on their own. Our only hope is God’s grace in Jesus Christ. Those He saves are restored to a life of worshiping God.
    refs:
      zh: 创1:26–27；创3:1–19；赛43:7；罗3:23；罗6:23；弗2:1–10
      en: Gen 1:26–27; Gen 3:1–19; Isa 43:7; Rom 3:23; Rom 6:23; Eph 2:1–10
  - title:
      zh: 救恩
      en: Salvation
    text:
      zh: 我们相信人得救唯独本乎恩、唯独因着信、唯独在基督里。耶稣在十字架上替我们承担了悖逆神应受的刑罚。人不能靠行善或任何方法救自己。凡信靠耶稣的人，罪得赦免，与神和好，被收纳为神的儿女，并有永远与神同在的应许。
      en: We believe salvation is by grace alone, through faith alone, in Christ alone. On the cross Jesus took the punishment we deserved for rebelling against God. No one can save themselves by good works or any other way. Everyone who trusts in Jesus is forgiven, brought back to God, adopted as His child, and promised eternal life with Him.
    refs:
      zh: 约1:12；徒2:38；罗8:14–17；弗2:8–10；彼前1:18–19；彼前3:18
      en: John 1:12; Acts 2:38; Rom 8:14–17; Eph 2:8–10; 1 Pet 1:18–19; 1 Pet 3:18
  - title:
      zh: 教会
      en: The Church
    text:
      zh: 我们相信神要每一位基督徒加入一个地方教会，与住在同一地区的信徒定期聚会、一同敬拜。加入教会就是委身去爱、去服事其他肢体：彼此劝勉、坚固彼此的信心，在实际生活中互相照顾。
      en: "We believe God calls every Christian to belong to a local church: believers in one place who meet regularly to worship together. Joining a church means committing to love and serve its members by encouraging one another, strengthening one another’s faith, and caring for one another in practical ways."
    refs:
      zh: 徒2:42；罗12:3–16；弗4:11–16；来10:24–25
      en: Acts 2:42; Rom 12:3–16; Eph 4:11–16; Heb 10:24–25
  - title:
      zh: 天使
      en: Angels
    text:
      zh: 我们相信天使是神所造的，为要事奉、敬拜祂，传达祂的信息，并服事信徒。魔鬼是堕落的天使，邪恶、诡诈、有能力，但仍在耶稣基督的主权和能力之下。
      en: "We believe God created angels to serve and worship Him, carry His messages and help believers. Demons are fallen angels: evil, deceptive and powerful, yet still under the authority and power of Jesus Christ."
    refs:
      zh: 太8:29；路2:9–14；路7:21；提前4:1；来1:6–7, 14；启1:1–3
      en: Matt 8:29; Luke 2:9–14; Luke 7:21; 1 Tim 4:1; Heb 1:6–7, 14; Rev 1:1–3
  - title:
      zh: 末世
      en: The Last Things
    text:
      zh: 我们相信耶稣基督必再来，建立祂公义、和平的国度。祂要彻底击败撒但，创造新天新地，那里不再有罪、悲伤和疾病。信徒要在新天新地里与神同在，永远敬拜祂、以祂为乐。
      en: We believe Jesus Christ will come again and set up His kingdom of justice, peace and righteousness. He will defeat Satan for good and make a new heaven and a new earth, where there is no more sin, sorrow or sickness. Believers will live there with God, worshiping and enjoying Him forever.
    refs:
      zh: 太25:41；彼后3:10；启20:1–10；启21:1–8
      en: Matt 25:41; 2 Pet 3:10; Rev 20:1–10; Rev 21:1–8
  - title:
      zh: 婚姻与性
      en: Marriage and Sexuality
    text:
      zh: 我们相信神设立婚姻是一男一女、一夫一妻终身的盟约，象征基督与教会之间的爱。神也定意性关系只在婚姻中的夫妻之间。
      en: We believe God designed marriage as a lifelong covenant between one man and one woman, a picture of Christ’s love for the church. God intends sexual intimacy only between a husband and wife within marriage.
    refs:
      zh: 创1:27–28；创2:23–24；罗1:24–28；林前6:9–10；弗5:22–33；帖前4:1–8
      en: Gen 1:27–28; Gen 2:23–24; Rom 1:24–28; 1 Cor 6:9–10; Eph 5:22–33; 1 Thess 4:1–8
  - title:
      zh: 性别
      en: Gender
    text:
      zh: 我们相信神照着自己的形像造了亚当和夏娃，男人和女人在神面前同样尊贵，又各有不同。这男女之别是神起初美好的设计，为要叫人蒙福、得喜乐。
      en: We believe God created Adam and Eve in His image, male and female, equal in worth before Him and distinct from each other. This distinction is part of God’s good design from the beginning, given for the blessing and joy of the people He made.
    refs:
      zh: 创1:27–28；申22:5；林前6:9–10
      en: Gen 1:27–28; Deut 22:5; 1 Cor 6:9–10
question:
  zh: 对我们的信仰有疑问？欢迎在主日后找我们聊聊，或者写信给我们。
  en: Questions about what we believe? Come talk with us after a Sunday service, or send us a note.
button:
  zh: 联系我们
  en: Contact us

  - slug: grace-thanksgiving-2026
    published: true
    sample: false
    title:
      zh: 恩典满溢｜感恩分享会
      en: Grace — Thanksgiving Gathering
      hant: ""
    summary:
      zh: 同享美食，分享感恩。邀请您与我们相聚，一同数算神的恩典，在温暖的团契中彼此鼓励。
      en: Share a meal and a grateful heart. Join us to reflect on God’s grace and
        encourage one another through fellowship.
      hant: ""
    location:
      zh: 柱石华人圣经教会
      en: Pillar Chinese Bible Church
      hant: ""
    joining:
      zh: 欢迎参加！有关参加安排，请联系教会。
      en: You are welcome to join us! Please contact the church for participation
        details.
      hant: ""
    details:
      zh: |-
        恩典满溢，让我们一同数算恩典，分享感恩。

        邀请您参加柱石华人圣经教会的感恩分享会。让我们在美食与相聚中，分享生活中的感恩，回顾神的恩典，彼此认识、彼此鼓励。

        同享美食 · 分享感恩
      en: >-
        Join Pillar Chinese Bible Church for Overflowing Grace, a gathering of
        thanksgiving and fellowship.


        Come share a meal, reflect on God’s grace, and share what you are
        thankful for. We look forward to connecting and encouraging one another.


        Share a meal · Share your gratitude
      hant: ""
    start: 2026-12-04T18:30:00-08:00
    end: 2026-12-04T20:30:00-08:00
    address: 211 Church Street, Mountain View, CA 94041
    image: /images/event-grace-thanksgiving-2026-3a1b440293ebbb61.jpg
    image_alt:
      zh: "\t柱石华人圣经教会“恩典满溢”感恩分享会海报，12月4日晚上6:30举行。"
      en: Poster for the Overflowing Grace Thanksgiving Gathering at Pillar Chinese
        Bible Church, December 4 at 6:30 PM.
      hant: ""
    image_position:
      x: 50
      y: 40

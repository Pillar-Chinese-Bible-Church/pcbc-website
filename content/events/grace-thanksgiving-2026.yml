details:
  zh: |-
    恩典满溢，让我们一同数算恩典、分享感恩。

    邀请您参加柱石华人圣经教会的感恩分享会。让我们在美食与相聚中，分享生活中的感恩，回顾神的恩典，彼此认识、彼此鼓励。

    同享美食 · 分享感恩
  en: >-
    Join Pillar Chinese Bible Church for Overflowing Grace, a gathering of
    thanksgiving and fellowship.


    Come share a meal, reflect on God’s grace, and share what you are thankful
    for. We look forward to connecting and encouraging one another.


    Share a meal · Share your gratitude

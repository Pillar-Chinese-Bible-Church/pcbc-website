name: Publish website
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character main commit SHA from the preview you reviewed
        required: true
        type: string
permissions:
  contents: read
concurrency: publish
jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
    steps:
      - name: Validate revision input
        id: revision
        env:
          REVISION: ${{ inputs.commit_sha }}
        run: |
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enter a full commit SHA'; exit 1; }
          echo "sha=$REVISION" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.revision.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a main commit
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.sha }}
          fetch-depth: 0
      - name: Publish the tested revision
        env:
          REVISION: ${{ needs.validate.outputs.sha }}
        run: |
          bash scripts/publish.sh
          echo "Moved live to validated commit $REVISION. Cloudflare deployment status is available in the repository checks." >> "$GITHUB_STEP_SUMMARY"

# Pages CMS (https://pagescms.org) editing screens for the church website.
# Each text field has three boxes: 简体, 繁體 (optional: left empty, it is converted from 简体 automatically) and English.
# `&line` / `&para` define those three boxes once; `*line` / `*para` reuse them.

# Photos live in src/images and appear on the site as /images/… (the paths stored in the content files).
media:
  input: src/images
  output: /images

content:
  - name: sermons
    label: 主日讲道与周报 Sermons and bulletins
    type: file
    path: content/sermons.yml
    format: yaml
    fields:
      - { name: version, label: Content version, type: number, default: 1 }
      - name: items
        label: 主日信息 Sundays (latest 52 weeks)
        type: object
        list: true
        fields:
          - { name: date, label: 主日日期 Sunday date (YYYY-MM-DD), type: string }
          - { name: published, label: 发布 Publish, type: boolean, default: false }
          - name: title
            label: 讲道题目 Sermon title
            type: object
            fields: &sermon_text
              - { name: zh, label: 简体, type: string }
              - { name: hant, label: 繁體（可以不填）, type: string }
              - { name: en, label: English, type: string }
          - { name: speaker, label: 讲员 Speaker, type: object, fields: *sermon_text }
          - { name: recording, label: 录像状态 Recording (pending / ready / unavailable), type: string, default: pending }
          - { name: youtube_id, label: YouTube video ID (only when ready; remove otherwise), type: string }
          - name: bulletin
            label: 周报 Bulletin (optional)
            type: object
            fields:
              - name: program
                label: 崇拜程序 Order of worship
                type: object
                list: true
                fields:
                  - { name: label, label: 项目 Item, type: object, fields: *sermon_text }
                  - { name: detail, label: 内容 Details, type: object, fields: *sermon_text }
              - name: announcements
                label: 家事分享 Announcements
                type: object
                list: true
                fields:
                  - { name: heading, label: 标题 Heading, type: object, fields: *sermon_text }
                  - name: text
                    label: 内容 Text
                    type: object
                    fields:
                      - { name: zh, label: 简体, type: text }
                      - { name: hant, label: 繁體（可以不填）, type: text }
                      - { name: en, label: English, type: text }
                  - { name: link, label: 链接 HTTPS link (optional), type: string }
                  - { name: link_label, label: 链接文字 Link label (only with link), type: object, fields: *sermon_text }
  - name: site
    label: 基本信息 Basics
    type: file
    path: src/_data/site.yml
    format: yaml
    fields:
      - name: name
        label: 教会名称 Church name
        type: object
        fields: &line
          - { name: zh, label: 简体, type: string }
          - { name: hant, label: 繁體（可以不填，会自动转换）, type: string }
          - { name: en, label: English, type: string }
      - { name: address, label: 地址 Address, type: string }
      - { name: map_link, label: 地图链接 Map link (Google Maps), type: string }
      - { name: email, label: 邮箱 Email, type: string }
      - name: sunday
        label: 主日崇拜 Sunday worship
        type: object
        fields:
          - { name: time, label: 时间（显示在首页）Time, type: object, fields: *line }
          - { name: short_time, label: 简短时间（例如 10:30am）, type: string }
          - { name: place, label: 地点 Place, type: string }
          - { name: note, label: 说明（例如：国语崇拜，提供英文翻译）, type: object, fields: *line }
      - name: links
        label: 网上链接 Links (leave empty to hide)
        type: object
        fields:
          - { name: youtube, label: YouTube, type: string }
          - { name: wechat, label: 微信公众号 WeChat, type: string }
          - { name: xiaohongshu, label: 小红书 RedNote, type: string }
      - { name: footer_note, label: 页面最下方的小字（可以不填）Footer note, type: object, fields: *line }

  - name: homepage
    label: 首页 Homepage
    type: file
    path: src/_data/homepage.yml
    format: yaml
    fields:
      - name: hero
        label: 顶部大图 Top photo
        type: object
        fields:
          - name: title
            label: 标题（可以换行）Title
            type: object
            fields: &para
              - { name: zh, label: 简体, type: text }
              - { name: hant, label: 繁體（可以不填，会自动转换）, type: text }
              - { name: en, label: English, type: text }
          - { name: subtitle, label: 副标题 Subtitle, type: object, fields: *line }
          - { name: button, label: 按钮文字 Button, type: object, fields: *line }
          - { name: about_button, label: 第二个按钮（关于我们）About button, type: object, fields: *line }
          - { name: image, label: 照片 Photo, type: image }
          - { name: image_alt, label: 照片说明（给看不见图片的人）Photo description, type: object, fields: *line }
      - name: sunday
        label: 主日崇拜 Sunday worship section
        type: object
        fields:
          - { name: heading, label: 标题 Heading, type: object, fields: *line }
          - { name: first_time, label: “第一次来？”, type: object, fields: *line }
          - { name: first_time_link, label: “第一次来”的链接文字, type: object, fields: *line }
          - { name: missed, label: “错过了主日？”, type: object, fields: *line }
          - { name: missed_link, label: “错过了主日”的链接文字, type: object, fields: *line }
          - { name: image, label: 照片 Photo, type: image }
          - { name: image_alt, label: 照片说明 Photo description, type: object, fields: *line }
      - name: week
        label: 每周聚会 Weekly gatherings
        type: object
        fields:
          - { name: heading, label: 标题 Heading, type: object, fields: *line }
          - { name: intro, label: 介绍（可以不填）Intro, type: object, fields: *para }
          - name: gatherings
            label: 聚会（可以添加、删除、拖动排序）Gatherings
            type: object
            list: true
            fields:
              - { name: name, label: 聚会名称 Name, type: object, fields: *line }
              - { name: time, label: 时间 When, type: object, fields: *line }
              - { name: place, label: 地点（可以不填）Where, type: object, fields: *line }
              - { name: topic, label: 内容（可以不填）What, type: object, fields: *line }
      - name: verse
        label: 经文 Verse
        type: object
        fields:
          - { name: text, label: 经文（可以换行）Verse, type: object, fields: *para }
          - { name: reference, label: 出处 Reference, type: object, fields: *line }
          - { name: note, label: 说明（可以不填）Note, type: object, fields: *line }
      - name: values
        label: 核心价值 Values
        type: object
        fields:
          - { name: heading, label: 标题 Heading, type: object, fields: *line }
          - { name: mission, label: 使命 Mission, type: object, fields: *para }
          - { name: button, label: 按钮文字 Button, type: object, fields: *line }

  - name: core_values
    label: 核心价值 Core Values
    type: file
    path: src/_data/values.yml
    format: yaml
    fields:
      - name: items
        label: 价值（首页摘要及关于我们全文）Values
        type: object
        list: true
        fields:
          - { name: title, label: 标题 Title, type: object, fields: *line }
          - { name: summary, label: 首页摘要 Homepage summary, type: object, fields: *para }
          - { name: text, label: 完整内容 Full text, type: object, fields: *para }
          - { name: refs, label: 经文出处 Bible references, type: object, fields: *line }

  - name: about
    label: 关于我们 About Us
    type: file
    path: src/_data/about.yml
    format: yaml
    fields:
      - { name: title, label: 标题 Title, type: object, fields: *line }
      - { name: intro, label: 介绍 Introduction, type: object, fields: *para }
      - name: mission
        label: 使命 Mission
        type: object
        fields:
          - { name: heading, label: 标题 Heading, type: object, fields: *line }
          - { name: text, label: 内容 Text, type: object, fields: *para }
          - { name: welcome, label: 欢迎语 Welcome, type: object, fields: *para }
      - name: pastor
        label: 牧者 Pastor
        type: object
        fields:
          - { name: heading, label: 栏目标题 Heading, type: object, fields: *line }
          - { name: name, label: 姓名 Name, type: object, fields: *line }
          - { name: role, label: 职分 Role, type: object, fields: *line }
          - { name: bio, label: 牧者简介 Biography, type: object, fields: *para }
          - { name: email, label: 邮箱 Email, type: string }
          - { name: email_label, label: 邮箱文字 Email label, type: object, fields: *line }
          - { name: image, label: 照片 Portrait, type: image }
          - { name: image_alt, label: 照片说明 Portrait description, type: object, fields: *line }
      - { name: beliefs_link, label: 信仰告白按钮 Beliefs link, type: object, fields: *line }
      - { name: visit_heading, label: 到访标题 Visit heading, type: object, fields: *line }
      - { name: visit_link, label: 主日信息链接 Sunday link, type: object, fields: *line }
      - { name: contact_link, label: 联系链接 Contact link, type: object, fields: *line }
      - name: life
        label: 教会生活 Church life
        type: object
        fields:
          - { name: heading, label: 标题 Heading, type: object, fields: *line }
          - name: rows
            label: 每一行（照片 + 文字）Rows
            type: object
            list: true
            fields:
              - { name: title, label: 标题 Title, type: object, fields: *line }
              - { name: text, label: 文字 Text, type: object, fields: *para }
              - { name: image, label: 照片 Photo, type: image }
              - { name: image_alt, label: 照片说明 Photo description, type: object, fields: *line }

  - name: event_section
    label: 活动栏目 Events section
    type: file
    path: src/_data/events.yml
    format: yaml
    fields:
      - { name: heading, label: 标题 Heading, type: object, fields: *line }
      - { name: intro, label: 介绍 Intro, type: object, fields: *para }

  - name: events
    label: 活动 Events
    type: file
    path: content/events.yml
    format: yaml
    fields:
      - { name: version, label: 数据版本 Data version (keep 1), type: number, default: 1 }
      - name: items
        label: 活动 Events
        type: object
        list: true
        fields:
          - { name: slug, label: 网址名称 URL slug (lowercase letters / numbers / hyphens), type: string }
          - { name: published, label: 启用 Enabled, type: boolean }
          - { name: sample, label: 示例 Sample (feature previews only), type: boolean }
          - { name: title, label: 活动名称 Title, type: object, fields: *line }
          - { name: summary, label: 简介 Summary, type: object, fields: *para }
          - { name: start, label: 开始 Start (e.g. 2026-12-06T12:30:00-08:00), type: string }
          - { name: end, label: 结束 End (e.g. 2026-12-06T14:30:00-08:00), type: string }
          - { name: location, label: 地点 Location, type: object, fields: *line }
          - { name: address, label: 地址 Address (optional), type: string }
          - { name: map_url, label: 地图链接 Map URL (HTTPS / optional), type: string }
          - { name: image, label: 图片 Image (optional), type: image }
          - { name: image_alt, label: 图片描述 Image description, type: object, fields: *line }
          - name: image_position
            label: 图片位置 Image position (optional)
            type: object
            fields:
              - { name: x, label: 水平 Horizontal (0–100), type: number }
              - { name: y, label: 垂直 Vertical (0–100), type: number }
          - { name: joining, label: 参加方式 How to join, type: object, fields: *para }
          - { name: registration_url, label: 报名链接 Registration URL (HTTPS / optional), type: string }
          - { name: details, label: 活动介绍 Full description, type: object, fields: *para }

  - name: photos
    label: 照片墙 Photo strip
    type: file
    path: src/_data/photos.yml
    format: yaml
    fields:
      - { name: label, label: 照片墙名称（给读屏软件）, type: object, fields: *line }
      - name: strip
        label: 照片（可以添加、删除、拖动排序）Photos
        type: object
        list: true
        fields:
          - { name: image, label: 照片 Photo, type: image }
          - { name: alt, label: 照片说明 Photo description, type: object, fields: *line }

  - name: beliefs
    label: 信仰告白 Statement of faith
    type: file
    path: src/_data/beliefs.yml
    format: yaml
    fields:
      - { name: title, label: 标题 Title, type: object, fields: *line }
      - { name: intro, label: 页首简介 Header description, type: object, fields: *para }
      - name: items
        label: 条目（可以添加、删除、拖动排序）Points
        type: object
        list: true
        fields:
          - { name: title, label: 标题 Title, type: object, fields: *line }
          - { name: text, label: 内容 Text, type: object, fields: *para }
          - { name: refs, label: 经文出处 Bible references, type: object, fields: *line }
      - { name: question, label: 页面最后的问题 Closing question, type: object, fields: *para }
      - { name: button, label: 按钮文字 Button, type: object, fields: *line }

  - name: giving
    label: 奉献 Giving
    type: file
    path: src/_data/giving.yml
    format: yaml
    fields:
      - { name: title, label: Title, type: object, fields: *para }
      - { name: intro, label: Intro, type: object, fields: *para }
      - { name: thanks, label: Thanks, type: object, fields: *para }
      - { name: methods_heading, label: Methods Heading, type: object, fields: *para }
      - { name: zelle_email, label: Zelle Email, type: string }
      - { name: office_email, label: Office Email, type: string }
      - { name: payee, label: Payee, type: string }
      - { name: qr_image, label: Qr Image, type: image }
      - { name: qr_alt, label: Qr Alt, type: object, fields: *para }
      - name: zelle
        label: Zelle
        type: object
        fields:
          - { name: title, label: Title, type: object, fields: *para }
          - { name: text, label: Text, type: object, fields: *para }
          - { name: recipient, label: Recipient, type: object, fields: *para }
          - { name: email_label, label: Email Label, type: object, fields: *para }
          - { name: scan, label: Scan, type: object, fields: *para }
          - { name: open_qr, label: Open Qr, type: object, fields: *para }
          - { name: copy, label: Copy, type: object, fields: *para }
          - { name: copied, label: Copied, type: object, fields: *para }
          - { name: copy_fallback, label: Copy Fallback, type: object, fields: *para }
      - name: checks
        label: Checks
        type: object
        fields:
          - { name: title, label: Title, type: object, fields: *para }
          - { name: text, label: Text, type: object, fields: *para }
      - name: stock
        label: Stock
        type: object
        fields:
          - { name: title, label: Title, type: object, fields: *para }
          - { name: text, label: Text, type: object, fields: *para }
          - { name: email_step, label: Email Step, type: object, fields: *para }
          - { name: transfer_step, label: Transfer Step, type: object, fields: *para }
          - { name: receipt_step, label: Receipt Step, type: object, fields: *para }
          - { name: year_end, label: Year End, type: object, fields: *para }
      - name: matching
        label: Matching
        type: object
        fields:
          - { name: title, label: Title, type: object, fields: *para }
          - { name: text, label: Text, type: object, fields: *para }
          - { name: note, label: Note, type: object, fields: *para }
      - name: statements
        label: Statements
        type: object
        fields:
          - { name: title, label: Title, type: object, fields: *para }
          - { name: text, label: Text, type: object, fields: *para }
          - { name: contact, label: Contact, type: object, fields: *para }
